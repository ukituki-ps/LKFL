# LKFL Keycloak Theme — Login (Freeform)
# Based on @ukituki-ps/april-tokens v0.1.16
# Extends Keycloak base theme for templates, overrides appearance

parent=keycloak
import=keycloak.v2

# ---- Theme metadata ----
themes.version=1.0

# ---- Intl ----
locales=true
default.locale=en
supported.locales=*

# ---- Login page ----
logo=/resources/lkfl-theme/logo.svg
logo-url=https://dev.april.ukituki.tech
favicon=/favicon.ico

# ---- Custom CSS ----
styles=css/login.css

# ---- Meta (for mobile) ----
meta=viewport=width=device-width, initial-scale=1.0
