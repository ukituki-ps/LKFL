# LKFL — Frontend Nginx config (SPA serving)
# Serve index.html for all routes (React Router handles client-side routing)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — все маршруты идут через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets — long-term cache
    location ~ ^/assets/.*\.[a-zA-Z0-9]+\.(js|css|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # images
    location ~ ^/images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
