# ============================================================================
# LKFL — Nginx конфиг для serverAi: dev стенд (порт 18002)
# ============================================================================
#
# Назначение:
#   Проксирование запросов от serverPr01 на внутренние Docker-сервисы dev стенда.
#   Слушает порт 18002 (отдельно от staging на 18000).
#
# Архитектура:
#   serverPr01 (443 ssl) → serverAi:18002 (HTTP) → Docker-сервисы
#   serverPr01 передаёт X-Forwarded-Proto: https
#   Этот nginx передаёт эту схему дальше БЕЗ перезаписи
#
# Фактические порты Docker-сервисов dev:
#   lkfl-server:              127.0.0.1:18082  (container 8080)
#   lkfl-frontend:            127.0.0.1:18088   (container 80)
#   keycloak:                 127.0.0.1:19083  (container 8080)
#   lkfl-integration-proxy:   127.0.0.1:18095  (container 8091)
#
# Установка:
#   Скопировать в /etc/nginx/sites-available/lkfl-dev-internal.conf на serverAi
#   ln -s /etc/nginx/sites-available/lkfl-dev-internal.conf /etc/nginx/sites-enabled/
#   nginx -t && nginx -s reload
#
# ============================================================================

server {
    listen 18002;
    server_name _;

    # ------------------------------------------------------------------
    # Логи
    # ------------------------------------------------------------------
    access_log /var/log/nginx/lkfl-dev-access.log;
    error_log /var/log/nginx/lkfl-dev-error.log warn;

    # ------------------------------------------------------------------
    # Ограничение размера загружаемых файлов
    # ------------------------------------------------------------------
    client_max_body_size 50m;

    # ------------------------------------------------------------------
    # API → lkfl-server (backend, 127.0.0.1:18082)
    # ------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:18082/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------
    # Admin API → lkfl-server (127.0.0.1:18082)
    # ------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://127.0.0.1:18082/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------
    # Health check → lkfl-server (127.0.0.1:18082)
    # ------------------------------------------------------------------
    location /healthz {
        proxy_pass http://127.0.0.1:18082/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------
    # Nginx собственный health check
    # ------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # Keycloak — discovery + realms (OIDC, 127.0.0.1:19083)
    # ------------------------------------------------------------------
    location /realms/ {
        proxy_pass http://127.0.0.1:19083/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------
    # Keycloak — services (127.0.0.1:19083)
    # ------------------------------------------------------------------
    location /services/ {
        proxy_pass http://127.0.0.1:19083/services/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------
    # Webhooks → integration-proxy (127.0.0.1:18095)
    # ------------------------------------------------------------------
    location /webhooks/ {
        proxy_pass http://127.0.0.1:18095/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # ------------------------------------------------------------------
    # Frontend SPA (fallback) — React-приложение (127.0.0.1:18088)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:18088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
