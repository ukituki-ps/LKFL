# LKFL — Server Nginx config (local dev)
# Routes external traffic to internal Docker services
# Dev: HTTP on :80 + self-signed HTTPS on :443
# Staging: external nginx → serverAi:18000

# Docker DNS resolver for dynamic upstream resolution (dev environment)
resolver 127.0.0.11 valid=30s;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;

upstream lkfl_server {
    server lkfl-server:8080;
}

upstream lkfl_frontend {
    server frontend:80;
}

upstream keycloak {
    server keycloak:8080;
}

# Deploy worker — webhook endpoint для CI/CD (только staging, нет в dev)
# upstream deploy_worker {
#     server lkfl-deploy-worker:9092;
# }

# ============================================================================
# HTTP — основной сервер (dev + staging fallback)
# Без HSTS — чтобы не ломать HTTP-only сценарии. HSTS только на HTTPS блоке.
# Для login flow использовать HTTPS (:443) — Secure cookies Keycloak работают
# корректно только через HTTPS.
# ============================================================================
server {
    listen 80;
    server_name dev.april.ukituki.tech localhost project.ukituki.tech;

    client_max_body_size 20M;

    # Security headers (без HSTS — это HTTP блок)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health endpoint (для healthcheck nginx в docker-compose)
    location /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # CORS preflight for API
    location /api {
        limit_req zone=api burst=20 nodelay;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://lkfl_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Use $scheme for dev (HTTP). Staging external nginx overrides with https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Staging-only: tenant resolution по X-Tenant-ID.
        # TODO M23+: динамическое разрешение по hostname.
        proxy_set_header X-Tenant-ID sdek;
    }

    # Admin API
    location /admin {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://lkfl_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Staging-only: tenant resolution по X-Tenant-ID.
        # TODO M23+: динамическое разрешение по hostname.
        proxy_set_header X-Tenant-ID sdek;
    }

    # Keycloak OAuth2 callback — POST → GET redirect, затем proxy на frontend
    # Frontend Callback.tsx сам делает fetch к /api/v1/auth/callback
    location = /callback {
        if ($request_method = POST) {
            return 302 /callback$is_args$args;
        }
        proxy_pass http://lkfl_frontend;
        proxy_set_header Host $host;
    }

    # Health check (proxy на lkfl-server)
    location /healthz {
        proxy_pass http://lkfl_server;
        proxy_set_header Host $host;
    }

    # Keycloak routes — proxy на Keycloak
    # HTTP блок: Secure cookies от Keycloak будут заблокированы браузером.
    # Для login flow используйте HTTPS (:443).
    location /realms {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://keycloak;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    location /protocol {
        proxy_pass http://keycloak;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    location /resources {
        proxy_pass http://keycloak;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /services {
        proxy_pass http://keycloak;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    location /account {
        proxy_pass http://keycloak;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    # Keycloak login-actions — POST form submissions during auth flow
    location /login-actions {
        proxy_pass http://keycloak;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    # Frontend — proxy на lkfl-frontend (НЕ static из volume)
    # index.html — never cache (always fetch latest)
    location = /index.html {
        proxy_pass http://lkfl_frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed assets — long-term cache (filename includes content hash)
    location ~ ^/assets/.*\.[a-zA-Z0-9]+\.(js|css|map)$ {
        proxy_pass http://lkfl_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback — proxy на lkfl-frontend
    location / {
        proxy_pass http://lkfl_frontend;
    }
}

# ============================================================================
# HTTPS — self-signed TLS для local dev (port 443)
# Основной вход для login flow: Secure cookies Keycloak работают через HTTPS.
# Сертификат: self-signed, SAN=DNS:project.ukituki.tech,DNS:localhost,IP:127.0.0.1
# ============================================================================
server {
    listen 443 ssl;
    server_name project.ukituki.tech localhost;

    # Self-signed TLS cert (local dev only)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # Security headers — с HSTS (только для HTTPS блока)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health endpoint (для healthcheck nginx в docker-compose)
    location /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # CORS preflight for API
    location /api {
        limit_req zone=api burst=20 nodelay;
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://lkfl_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant-ID sdek;
    }

    # Admin API
    location /admin {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://lkfl_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Tenant-ID sdek;
    }

    # Keycloak OAuth2 callback — POST → GET redirect, затем proxy на frontend
    location = /callback {
        if ($request_method = POST) {
            return 302 /callback$is_args$args;
        }
        proxy_pass http://lkfl_frontend;
        proxy_set_header Host $host;
    }

    # Health check (proxy на lkfl-server)
    location /healthz {
        proxy_pass http://lkfl_server;
        proxy_set_header Host $host;
    }

    # Keycloak routes — proxy на Keycloak (HTTPS блок: Secure cookies OK)
    location /realms {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    location /protocol {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    location /resources {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /services {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    location /account {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    # Keycloak login-actions — POST form submissions during auth flow
    location /login-actions {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    # Frontend — proxy на lkfl-frontend (НЕ static из volume)
    location = /index.html {
        proxy_pass http://lkfl_frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed assets — long-term cache (filename includes content hash)
    location ~ ^/assets/.*\.[a-zA-Z0-9]+\.(js|css|map)$ {
        proxy_pass http://lkfl_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback — proxy на lkfl-frontend
    location / {
        proxy_pass http://lkfl_frontend;
    }
}
