# LKFL — Docker Compose Dev Server (serverAi)
# ADR-043: Два стенда — dev (ручной деплой) + staging (CI/CD)
#
# Dev стенд: project.ukituki.tech → serverPr01 (TLS) → serverAi (18002)
# Деплой: ручной, infra/deploy/dev-deploy.sh <IMAGE_TAG>
#
# Запуск:   docker compose -f docker-compose.dev-server.yml up -d
# Миграции: docker compose -f docker-compose.dev-server.yml run --rm lkfl-migrate
# Сид:      docker compose -f docker-compose.dev-server.yml run --rm lkfl-seed
# Логи:     docker compose -f docker-compose.dev-server.yml logs -f
# Мониторинг: docker compose -f docker-compose.dev-server.yml --profile monitoring up -d
#
# Требуется .env.dev-server (скопируйте из .env.dev-server.example)
# Образы: GHCR (ghcr.io/ukituki-ps/lkfl)

services:
  # =========================================================================
  # PostgreSQL 17 — основная база данных dev стенда
  # Schema: lkfl_platform_dev (основная), keycloak_dev (для Keycloak)
  # =========================================================================
  postgres:
    image: postgres:17-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "15434:5432"
    env_file:
      - .env.dev-server
    environment:
      POSTGRES_DB: lkfl_platform_dev
      TZ: Europe/Moscow
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lkfl} -d lkfl_platform_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - lkfl_backend_dev

  # =========================================================================
  # Redis 7 — кэш, сессии, очереди (Asynq)
  # =========================================================================
  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "16380:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
    env_file:
      - .env.dev-server
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    networks:
      - lkfl_backend_dev

  # =========================================================================
  # Keycloak 25.0 — OIDC Identity Provider
  # Dev стенд: start-dev режим, realm lkfl-sdek (shared config)
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "19083:8080"
    env_file:
      - .env.dev-server
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_dev
      KC_DB_USERNAME: ${POSTGRES_USER:-lkfl}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-lkfl}
      KC_HTTP_RELATIVE_PATH: /
      # ADR-037: hostname:v1 — форсировать HTTPS в issuer URL через nginx proxy
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: project.ukituki.tech
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_FRONTEND_URL: https://project.ukituki.tech
      KC_HOSTNAME_ADMIN: https://project.ukituki.tech
      TZ: Europe/Moscow
      RATE_LIMIT_AUTH: "100"
      RATE_LIMIT_CATALOG: "500"
      RATE_LIMIT_ADMIN: "200"
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak/realm-lkfl-sdek.json:/opt/keycloak/data/import/realm-lkfl-sdek.json:ro
      - ./infra/keycloak/theme:/opt/keycloak/themes/lkfl:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && exec 3>&-"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - lkfl_backend_dev
      - lkfl_frontend_dev

  # =========================================================================
  # lkfl-server — Go backend (modular monolith)
  # Pull из GHCR, graceful shutdown 30s → stop_grace_period 35s
  # =========================================================================
  lkfl-server:
    image: ${GHCR_REGISTRY:-ghcr.io/ukituki-ps/lkfl}/server:${IMAGE_TAG:-main-latest}
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "18082:8080"
    env_file:
      - .env.dev-server
    environment:
      DB_DSN: ${DB_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # ADR-037: issuer = публичный URL Keycloak
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-lkfl-spa}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-changeme-dev}
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SENTRY_DSN: ${SENTRY_DSN:-}
      JWT_SECRET: ${JWT_SECRET:-changeme-dev}
      TZ: Europe/Moscow
      RATE_LIMIT_AUTH: "100"
      RATE_LIMIT_CATALOG: "500"
      RATE_LIMIT_ADMIN: "200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "lkfl-server-dev"
    networks:
      - lkfl_backend_dev
      - lkfl_frontend_dev

  # =========================================================================
  # lkfl-integration-proxy — gRPC proxy к провайдерам льгот
  # =========================================================================
  lkfl-integration-proxy:
    image: ${GHCR_REGISTRY:-ghcr.io/ukituki-ps/lkfl}/proxy:${IMAGE_TAG:-main-latest}
    restart: unless-stopped
    ports:
      - "18094:8090"
      - "18095:8091"
    env_file:
      - .env.dev-server
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TZ: Europe/Moscow
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "lkfl-proxy-dev"
    networks:
      - lkfl_backend_dev
      - lkfl_frontend_dev

  # =========================================================================
  # lkfl-frontend — React SPA (отдельный образ из GHCR)
  # =========================================================================
  lkfl-frontend:
    image: ${GHCR_REGISTRY:-ghcr.io/ukituki-ps/lkfl}/frontend:${IMAGE_TAG:-main-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18088:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"
    networks:
      - lkfl_frontend_dev

  # =========================================================================
  # lkfl-migrate — one-shot: применяет DB миграции
  # =========================================================================
  lkfl-migrate:
    image: ${GHCR_REGISTRY:-ghcr.io/ukituki-ps/lkfl}/server:${IMAGE_TAG:-main-latest}
    command: ["migrate"]
    env_file:
      - .env.dev-server
    environment:
      DB_DSN: ${DB_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lkfl_backend_dev

  # =========================================================================
  # lkfl-seed — one-shot: загружает seed-данные
  # =========================================================================
  lkfl-seed:
    image: ${GHCR_REGISTRY:-ghcr.io/ukituki-ps/lkfl}/server:${IMAGE_TAG:-main-latest}
    command: ["seed"]
    env_file:
      - .env.dev-server
    environment:
      DB_DSN: ${DB_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lkfl_backend_dev

  # =========================================================================
  # Мониторинг — profiles: [monitoring]
  # Включение: docker compose --profile monitoring up -d
  # =========================================================================

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "19092:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - dev_prometheus_data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=15d
      --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    networks:
      - lkfl_backend_dev

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "13002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "http://localhost:3002"
      TZ: Europe/Moscow
    volumes:
      - ./infra/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/provisioning/dashboards/datasource.yml:/etc/grafana/provisioning/dashboards/datasource.yml:ro
      - ./infra/grafana/dashboards/platform-f1.json:/etc/grafana/provisioning/dashboards/platform-f1.json:ro
      - dev_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    networks:
      - lkfl_backend_dev

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.0.0
    restart: unless-stopped
    ports:
      - "13102:3100"
    volumes:
      - dev_loki_data:/tmp/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    networks:
      - lkfl_backend_dev

# =========================================================================
# Persistent volumes (dev: named volumes с префиксом dev_)
# =========================================================================
volumes:
  dev_pg_data:
    driver: local
  dev_redis_data:
    driver: local
  dev_prometheus_data:
    driver: local
  dev_grafana_data:
    driver: local
  dev_loki_data:
    driver: local

# =========================================================================
# Networks
# backend_dev — PostgreSQL, Redis, серверы, мониторинг (внутренняя сеть)
# frontend_dev — Nginx, серверы, Keycloak, lkfl-frontend
# =========================================================================
networks:
  lkfl_backend_dev:
    driver: bridge
    name: lkfl_backend_dev
  lkfl_frontend_dev:
    driver: bridge
    name: lkfl_frontend_dev
