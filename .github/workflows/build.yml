# T1708 — CI/CD Foundation: единый production-grade pipeline
# Заменяет ci.yml, cd.yml, deploy.yml (удалены).
# T1710 — добавлены E2E job'ы (e2e-local + e2e-staging).
# T2311 — добавлен job e2e-integration (реальный OIDC flow через Keycloak).
# ADR-045 — двухветочная стратегия: dev → staging, main → production.
#
# Все job'ы на self-hosted runner `lkfl` (serverAi: 192.168.1.27).
#
# Стратегия веток:
#   dev   — рабочая ветка, все мержат сюда → auto-deploy на staging
#   main  — стабильная ветка → production (manual)
#
# Pipeline:
#   1. lint-test            → Go + Frontend + OpenAPI + Config validation
#   2. e2e-local            → Playwright local mock tests (chromium)
#   3. build-push           → Docker Buildx + GHCR (matrix: server, proxy, frontend, deploy-worker)
#   4. deploy-staging       → docker compose на serverAi (auto on dev push)
#   5. smoke-test-staging   → infra/smoke-test.sh с retry polling
#   6. e2e-staging          → Playwright staging tests (real browser, dev push only)
#   7. e2e-integration      → Playwright integration tests (реальный OIDC, T2311)
#   8. deploy-production    → docker compose prod (manual workflow_dispatch)

name: Build & Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  GHCR_REGISTRY: ghcr.io/ukituki-ps/lkfl
  GOTOOLCHAIN: 'local'
  # T2310 R1: Persistent Go cache для self-hosted runner (GitHub Cache API недоступен)
  GOMODCACHE: /home/ukituki/go-cache/mod
  GOCACHE: /home/ukituki/go-cache/build
  # T2310 R5: Принудительный переход на Node.js 24 для actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # Job 1: LINT + TEST — self-hosted runner (lkfl label on serverAi)
  # =========================================================================
  lint-test:
    name: Lint & Test
    runs-on: lkfl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Go ──
      - name: Init Go cache directory (T2310 R1)
        run: |
          mkdir -p /home/ukituki/go-cache/mod /home/ukituki/go-cache/build
          echo "Go cache warm: $(du -sh /home/ukituki/go-cache/mod 2>/dev/null || echo 'cold')"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # T2310 R1: GitHub Cache API недоступен на self-hosted — используем persistent volume

      - name: Go mod tidy
        working-directory: backend
        run: go mod tidy

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Go unit tests (short)
        working-directory: backend
        run: go test ./... -short -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: backend
          args: --timeout=5m
          skip-cache: false # T2310 R3: включить кэш бинарника и analysis cache

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # T2310: cache отключён — GitHub Cache API недоступен на self-hosted,
          # ~/.npm persists locally между run'ами

      - name: Configure npm registry for @ukituki-ps packages
        working-directory: frontend
        run: |
          echo "@ukituki-ps:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src/

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest unit tests
        working-directory: frontend
        run: npx vitest run
        continue-on-error: true

      # ── OpenAPI ──
      - name: OpenAPI lint
        run: |
          if [[ -f doc/спецификация/api/openapi.yaml ]]; then
            npx @redocly/cli@latest lint doc/спецификация/api/openapi.yaml
          else
            echo "SKIP: openapi.yaml not found — create to enable lint"
          fi
        continue-on-error: true

      # ── Config validation ──
      - name: Validate docker-compose config
        run: |
          # Проверка: lkfl-server должен иметь KEYCLOAK_PUBLIC_URL
          for compose_file in docker-compose.staging.yml docker-compose.prod.yml; do
            if [[ -f "$compose_file" ]]; then
              in_server=0
              has_public_url=0
              while IFS= read -r line; do
                if echo "$line" | grep -q "^  lkfl-server:"; then
                  in_server=1
                elif [[ $in_server -eq 1 ]] && echo "$line" | grep -q "^  [a-z]"; then
                  break
                elif [[ $in_server -eq 1 ]] && echo "$line" | grep -q "KEYCLOAK_PUBLIC_URL"; then
                  has_public_url=1
                  break
                fi
              done < "$compose_file"
              if [[ $has_public_url -eq 0 ]]; then
                echo "FAIL: $compose_file — lkfl-server missing KEYCLOAK_PUBLIC_URL"
                exit 1
              fi
              echo "OK: $compose_file has KEYCLOAK_PUBLIC_URL"
            fi
          done

          # Проверка: KC_HOSTNAME не должен быть localhost
          for compose_file in docker-compose.staging.yml docker-compose.prod.yml; do
            if [[ -f "$compose_file" ]]; then
              hostname=$(grep "KC_HOSTNAME:" "$compose_file" | head -1 | awk '{print $2}' | tr -d '"' | tr -d ' ')
              if [[ -n "$hostname" ]] && [[ "$hostname" == "localhost" ]]; then
                echo "FAIL: $compose_file — KC_HOSTNAME='$hostname' is localhost"
                exit 1
              fi
            fi
          done
          echo "OK: KC_HOSTNAME validation passed"

 # =========================================================================
  # Job 2: E2E LOCAL TESTS — mock-based Playwright tests (chromium)
  # =========================================================================
  e2e-local:
    name: E2E Local Tests
    needs: [lint-test]
    runs-on: lkfl
    continue-on-error: true # T1710: новые E2E тесты — не ломать pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # T2310: cache отключён — GitHub Cache API недоступен на self-hosted

      - name: Configure npm registry for @ukituki-ps packages
        working-directory: frontend
        run: |
          echo "@ukituki-ps:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          # VITE_TEST_MODE=true — Login.tsx пропускает hard redirect на backend
          # (backend не запущен в local E2E — используется mock auth через Zustand)
          VITE_TEST_MODE=true npx vite --host 127.0.0.1 &
          # Ждём пока Vite начнёт отвечать
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo "Vite dev server ready"
              break
            fi
            if [[ $i -eq 30 ]]; then
              echo "Vite failed to start"
              exit 1
            fi
            echo "Waiting for Vite... ($i/30)"
            sleep 2
          done

      - name: E2E Local Tests (chromium)
        working-directory: frontend
        run: npx playwright test --config=playwright.config.ts --project=chromium
        continue-on-error: true # T1710: новые E2E тесты — не ломать pipeline
        timeout-minutes: 10

      - name: Stop Vite dev server
        if: always()
        working-directory: frontend
        run: |
          pkill -f "vite" || true

  # =========================================================================
  # Job 3: BUILD + PUSH — self-hosted runner (lkfl label on serverAi)
  # =========================================================================
  build-push:
    name: Build & Push Docker
    needs: [lint-test]
    runs-on: lkfl
    strategy:
      fail-fast: false
      max-parallel: 2 # T2310: уменьшил с 4 — на self-hosted runner 4 параллельных build'а потребляют слишком много RAM
      matrix:
        service: [server, proxy, frontend, deploy-worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main-${SHORT_SHA}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "tag=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[\/]/-/g')
            echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Init Docker cache directory
        run: |
          mkdir -p /home/ukituki/docker-cache/${{ matrix.service }}
          # Инициализировать index.json если нет (иначе buildx cache-from падает)
          if [[ ! -f /home/ukituki/docker-cache/${{ matrix.service }}/index.json ]]; then
            echo '{}' > /home/ukituki/docker-cache/${{ matrix.service }}/index.json
          fi
          # После build cache-to запишет в -new, нужно переименовать

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # T2310 R2: driver: docker (не docker-container) — docker-container нестабилен

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            NPM_TOKEN=${{ github.token }}
          cache-from: type=local,src=/home/ukituki/docker-cache/${{ matrix.service }}
          # mode=max + dest в -new → атомарная замена (не ломаем текущий кэш если export падает)
          cache-to: type=local,mode=max,dest=/home/ukituki/docker-cache/${{ matrix.service }}-new
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ (github.ref == 'refs/heads/main' && format('{0}/{1}:main-latest', env.GHCR_REGISTRY, matrix.service)) || '' }}
            ${{ (github.ref == 'refs/heads/dev' && format('{0}/{1}:dev-latest', env.GHCR_REGISTRY, matrix.service)) || '' }}

      # T2310 R6: deploy-worker buildx иногда падает с EOF при cache export
      # (Docker daemon graceful_stop). Ретраим build без cache.
      - name: Build deploy-worker retry (no cache)
        if: matrix.service == 'deploy-worker' && failure()
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.deploy-worker
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            NPM_TOKEN=${{ github.token }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/deploy-worker:${{ steps.tag.outputs.tag }}
            ${{ (github.ref == 'refs/heads/main' && 'ghcr.io/ukituki-ps/lkfl/deploy-worker:main-latest') || '' }}
            ${{ (github.ref == 'refs/heads/dev' && 'ghcr.io/ukituki-ps/lkfl/deploy-worker:dev-latest') || '' }}

      - name: Update Docker cache (T2310 R2)
        if: always()
        run: |
          # cache-to записал в -new, заменяем старый кэш (если -new существует)
          if [[ -d /home/ukituki/docker-cache/${{ matrix.service }}-new ]]; then
            rm -rf /home/ukituki/docker-cache/${{ matrix.service }}
            mv /home/ukituki/docker-cache/${{ matrix.service }}-new /home/ukituki/docker-cache/${{ matrix.service }}
          fi

  # =========================================================================
  # Job 4: DEPLOY STAGING — auto on dev push (ADR-045)
  # =========================================================================
  deploy-staging:
    name: Deploy Staging
    needs: [build-push]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: lkfl
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Sync compose + env + nginx to serverAi
        run: |
          # Runner уже на serverAi, файлы в GITHUB_WORKSPACE
          STAGING_DIR="/home/ukituki/LKFL-staging"
          cp docker-compose.staging.yml "$STAGING_DIR/"
          # Replace IMAGE_TAG (не append!) — иначе дубликаты → docker compose берёт старое значение
          if grep -q '^IMAGE_TAG=' "$STAGING_DIR/.env.staging"; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ steps.tag.outputs.tag }}|" "$STAGING_DIR/.env.staging"
          else
            echo "IMAGE_TAG=${{ steps.tag.outputs.tag }}" >> "$STAGING_DIR/.env.staging"
          fi
          if grep -q '^GHCR_REGISTRY=' "$STAGING_DIR/.env.staging"; then
            sed -i "s|^GHCR_REGISTRY=.*|GHCR_REGISTRY=${{ env.GHCR_REGISTRY }}|" "$STAGING_DIR/.env.staging"
          else
            echo "GHCR_REGISTRY=${{ env.GHCR_REGISTRY }}" >> "$STAGING_DIR/.env.staging"
          fi

      - name: Sync nginx config and reload
        continue-on-error: true
        run: |
          # Copy nginx config to staging dir (manual reload needed if path differs)
          cp infra/nginx/serverAi.conf /home/ukituki/LKFL-staging/
          echo "INFO: nginx config synced to /home/ukituki/LKFL-staging/serverAi.conf"
          echo "INFO: Manual action required — copy to /etc/nginx/sites-available/ and reload"
          # Try to reload (may fail without sudo)
          sudo nginx -t 2>/dev/null && sudo nginx -s reload 2>/dev/null || \
            echo "WARN: nginx reload requires sudo — check serverAi.conf port mapping manually"

      - name: Pull images
        working-directory: /home/ukituki/LKFL-staging
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          # Pull только наши образы из GHCR (keycloak/postgres/redis — pull_policy: missing, уже на сервере)
          docker compose -f docker-compose.staging.yml --env-file /home/ukituki/LKFL-staging/.env.staging -p lkfl-staging pull --ignore-buildable lkfl-server lkfl-integration-proxy lkfl-frontend lkfl-deploy-worker

      - name: Run migrations (retry 3x)
        working-directory: /home/ukituki/LKFL-staging
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          for i in 1 2 3; do
            echo "Migration attempt $i..."
            if docker compose -f docker-compose.staging.yml --env-file /home/ukituki/LKFL-staging/.env.staging -p lkfl-staging run --rm lkfl-migrate; then
              echo "Migrations applied successfully"
              break
            fi
            if [[ $i -lt 3 ]]; then
              echo "Retry in 10s..."
              sleep 10
            fi
          done

      - name: Run seed
        working-directory: /home/ukituki/LKFL-staging
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          docker compose -f docker-compose.staging.yml --env-file /home/ukituki/LKFL-staging/.env.staging -p lkfl-staging run --rm lkfl-seed || \
            echo "Warning: seed may have failed (data might already exist)"

      - name: Stop old staging services
        working-directory: /home/ukituki/LKFL-staging
        run: |
          docker compose -f docker-compose.staging.yml --env-file /home/ukituki/LKFL-staging/.env.staging -p lkfl-staging down || \
            echo "No old staging services to stop"
          # Kill orphan containers on all staging ports
          for port in 8086 9092 13000 13100 15432 16379 18080 18090 18091 19081 19090; do
            CID=$(docker ps -q --filter "publish=$port" 2>/dev/null)
            if [ -n "$CID" ]; then
              echo "Stopping orphan container on port $port: $CID"
              docker stop "$CID" 2>/dev/null
            fi
          done

      - name: Cleanup orphan containers
        run: |
          # Удаляем старые lkfl_* контейнеры от ручного docker compose (без project name)
          # Сохраняем мониторинг: lkfl_grafana, lkfl_prometheus, lkfl_loki
          for name in $(docker ps -a --format '{{.Names}}' | grep '^lkfl_' | grep -v '^lkfl-staging-'); do
            case "$name" in
              lkfl_grafana|lkfl_prometheus|lkfl_loki) continue ;;
              *) echo "Removing orphan: $name"; docker rm -f "$name" 2>/dev/null || true ;;
            esac
          done

      - name: Start services
        working-directory: /home/ukituki/LKFL-staging
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          docker compose -f docker-compose.staging.yml --env-file /home/ukituki/LKFL-staging/.env.staging -p lkfl-staging up -d

      - name: Ensure keycloak DB exists
        run: |
          # Postgres entrypoint init scripts only run on first volume init.
          # If volume was reused, keycloak DB may not exist.
          for i in $(seq 1 10); do
            if docker exec lkfl-staging-postgres-1 psql -U lkfl -d lkfl_platform -tc \
              "SELECT 1 FROM pg_database WHERE datname='keycloak'" 2>/dev/null | grep -q 1; then
              echo "keycloak DB exists"
              break
            fi
            echo "Waiting for postgres... attempt $i"
            sleep 5
          done
          docker exec lkfl-staging-postgres-1 psql -U lkfl -d lkfl_platform -c \
            "SELECT 'CREATE DATABASE keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='keycloak')\gexec" 2>/dev/null || true

      - name: Health check polling
        run: |
          echo "Waiting for services to become healthy..."
          for attempt in $(seq 1 10); do
            ALL_OK=true

            # Server health check
            if curl -sf http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              echo "  ✅ lkfl-server healthy"
            else
              echo "  ❌ lkfl-server not ready"
              ALL_OK=false
            fi

            # Frontend health check
            if curl -sf http://127.0.0.1:8086/ >/dev/null 2>&1; then
              echo "  ✅ lkfl-frontend healthy"
            else
              echo "  ❌ lkfl-frontend not ready"
              ALL_OK=false
            fi

            # Keycloak health check (25.0: management port not exposed, use HTTP)
            if docker compose -f /home/ukituki/LKFL-staging/docker-compose.staging.yml -p lkfl-staging ps keycloak 2>/dev/null | grep -q healthy; then
              echo "  ✅ keycloak healthy"
            else
              echo "  ❌ keycloak not ready"
              ALL_OK=false
            fi

            if [[ "$ALL_OK" == "true" ]]; then
              echo "All services healthy!"
              break
            fi

            if [[ $attempt -eq 10 ]]; then
              echo "❌ Health check failed after 10 attempts"
              docker compose -f docker-compose.staging.yml --env-file /home/ukituki/LKFL-staging/.env.staging -p lkfl-staging logs --tail=50
              exit 1
            fi

            echo "Attempt $attempt/10 — waiting 15s..."
            sleep 15
          done

      - name: Clean old images
        run: docker image prune -f

  # =========================================================================
  # Job 5: SMOKE TEST STAGING — после deploy-staging
  # =========================================================================
  smoke-test-staging:
    name: Smoke Test Staging
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: lkfl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests with retry
        run: |
          chmod +x infra/smoke-test.sh
          # 5 попыток с интервалом 10s
          MAX_ATTEMPTS=5 infra/smoke-test.sh --retry 5 https://dev.april.ukituki.tech

  # =========================================================================
  # Job 6: E2E STAGING TESTS — real browser against staging (cookie-based auth)
  # =========================================================================
  e2e-staging:
    name: E2E Staging Tests
    needs: [smoke-test-staging]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: lkfl
    continue-on-error: true # T1710: новые E2E тесты — не ломать pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Keycloak full readiness
        run: |
          echo "Waiting for Keycloak realm to be fully initialized after deploy..."
          # T2310 R4: polling OIDC discovery вместо hardcoded sleep 30
          for i in $(seq 1 20); do
            if curl -sf https://dev.april.ukituki.tech/realms/lkfl-sdek/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "Keycloak OIDC ready after ${i}s"
              break
            fi
            if [[ $i -eq 20 ]]; then
              echo "WARN: Keycloak OIDC not ready after 20 attempts — continuing anyway"
            fi
            sleep 3
          done

      - name: Verify OIDC discovery
        continue-on-error: true
        run: |
          echo "Checking Keycloak OIDC discovery..."
          if curl -sf https://dev.april.ukituki.tech/realms/lkfl-sdek/.well-known/openid-configuration > /tmp/kc-discovery.json 2>/dev/null; then
            cat /tmp/kc-discovery.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  issuer: {d.get(\"issuer\",\"?\")}')" 2>/dev/null || cat /tmp/kc-discovery.json
          else
            echo "WARN: OIDC discovery endpoint not reachable"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # T2310: cache отключён — GitHub Cache API недоступен на self-hosted

      - name: Configure npm registry for @ukituki-ps packages
        working-directory: frontend
        run: |
          echo "@ukituki-ps:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Load E2E credentials from staging .env
        run: |
          STAGING_ENV="/home/ukituki/LKFL-staging/.env.staging"
          if [[ -f "$STAGING_ENV" ]]; then
            # Экспортируем E2E_* переменные из .env.staging
            grep "^E2E_" "$STAGING_ENV" | while IFS='=' read -r key value; do
              echo "${key}=${value}" >> "$GITHUB_ENV"
            done
          else
            echo "WARNING: $STAGING_ENV not found, using defaults"
          fi

      - name: E2E Staging Tests
        working-directory: frontend
        run: npx playwright test --config=playwright.staging.config.ts
        continue-on-error: true # T1710: новые E2E тесты — не ломать pipeline
        timeout-minutes: 15

  # =========================================================================
  # Job 7: E2E INTEGRATION TESTS — реальный OIDC flow через Keycloak
  # =========================================================================
  e2e-integration:
    name: E2E Integration Tests
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: lkfl
    continue-on-error: true # T2311: новые интеграционные тесты — не ломать pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure npm registry for @ukituki-ps packages
        working-directory: frontend
        run: |
          echo "@ukituki-ps:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run E2E Integration Tests (real OIDC)
        working-directory: frontend
        run: E2E_BASE_URL=https://dev.april.ukituki.tech npx playwright test --project=integration
        continue-on-error: true # T2311: новые интеграционные тесты — не ломать pipeline
        timeout-minutes: 10

  # =========================================================================
  # Job 8: DEPLOY PRODUCTION — manual workflow_dispatch
  # =========================================================================
  deploy-production:
    name: Deploy Production
    needs: [smoke-test-staging]
    if: github.event_name == 'workflow_dispatch'
    runs-on: lkfl
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=main-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Sync compose + env to serverAi
        run: |
          PROD_DIR="/home/ukituki/LKFL-prod"
          mkdir -p "$PROD_DIR"
          cp docker-compose.prod.yml "$PROD_DIR/"
          echo "IMAGE_TAG=${{ steps.tag.outputs.tag }}" >> "$PROD_DIR/.env.prod"
          echo "GHCR_REGISTRY=${{ env.GHCR_REGISTRY }}" >> "$PROD_DIR/.env.prod"

      - name: Pull images
        working-directory: /home/ukituki/LKFL-prod
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          docker compose -f docker-compose.prod.yml --env-file /home/ukituki/LKFL-prod/.env.prod -p lkfl-prod pull --ignore-buildable

      - name: Run migrations (retry 3x)
        working-directory: /home/ukituki/LKFL-prod
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          for i in 1 2 3; do
            echo "Migration attempt $i..."
            if docker compose -f docker-compose.prod.yml --env-file /home/ukituki/LKFL-prod/.env.prod -p lkfl-prod run --rm lkfl-migrate; then
              echo "Migrations applied successfully"
              break
            fi
            if [[ $i -lt 3 ]]; then
              echo "Retry in 10s..."
              sleep 10
            fi
          done

      - name: Run seed
        working-directory: /home/ukituki/LKFL-prod
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          docker compose -f docker-compose.prod.yml --env-file /home/ukituki/LKFL-prod/.env.prod -p lkfl-prod run --rm lkfl-seed || \
            echo "Warning: seed may have failed (data might already exist)"

      - name: Stop old prod services
        working-directory: /home/ukituki/LKFL-prod
        run: |
          docker compose -f docker-compose.prod.yml --env-file /home/ukituki/LKFL-prod/.env.prod -p lkfl-prod down || \
            echo "No old prod services to stop"

      - name: Start services
        working-directory: /home/ukituki/LKFL-prod
        run: |
          export IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          export GHCR_REGISTRY="${{ env.GHCR_REGISTRY }}"
          docker compose -f docker-compose.prod.yml --env-file /home/ukituki/LKFL-prod/.env.prod -p lkfl-prod up -d

      - name: Health check polling
        run: |
          echo "Waiting for production services..."
          for attempt in $(seq 1 10); do
            ALL_OK=true

            if curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "  ✅ lkfl-server healthy"
            else
              echo "  ❌ lkfl-server not ready"
              ALL_OK=false
            fi

            if curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "  ✅ lkfl-frontend healthy"
            else
              echo "  ❌ lkfl-frontend not ready"
              ALL_OK=false
            fi

            if curl -sf http://127.0.0.1:8081/health/ready >/dev/null 2>&1; then
              echo "  ✅ keycloak healthy"
            else
              echo "  ❌ keycloak not ready"
              ALL_OK=false
            fi

            if [[ "$ALL_OK" == "true" ]]; then
              echo "All production services healthy!"
              break
            fi

            if [[ $attempt -eq 10 ]]; then
              echo "❌ Production health check failed after 10 attempts"
              docker compose -f docker-compose.prod.yml --env-file /home/ukituki/LKFL-prod/.env.prod -p lkfl-prod logs --tail=50
              exit 1
            fi

            echo "Attempt $attempt/10 — waiting 15s..."
            sleep 15
          done

      - name: Clean old images
        run: docker image prune -f
