## Метрики успеха

- `gh workflow run build.yml` на PR → Job 1 PASS
- Push на main → Job 1+2+3+4 PASS → staging доступен
- `workflow_dispatch` → Job 5 PASS → production доступен
- `https://dev.april.ukituki.tech/healthz` → 200
- Frontend загружается
- API работает (401 without token)
- Deploy-worker: все 5 endpoints работают
- Concurrency lock: 409 при параллельном deploy
